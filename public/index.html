<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Matrix & Talent Management</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--bd:#dde3ee;--pri:#1f3864;--acc:#2f6fdd;--l0:#eceff4;--l1:#fbd5d2;--l2:#fdeab0;--l3:#cdeed8;--l4:#93d9ad}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111622;--card:#1a2130;--tx:#e6eaf2;--mut:#98a2b3;--bd:#2c3547;--pri:#8fb0ee;--acc:#6b9cff;--l0:#262e40;--l1:#5b2b2b;--l2:#5a4a1c;--l3:#24502f;--l4:#2f7a48}}
:root[data-theme="dark"]{--bg:#111622;--card:#1a2130;--tx:#e6eaf2;--mut:#98a2b3;--bd:#2c3547;--pri:#8fb0ee;--acc:#6b9cff;--l0:#262e40;--l1:#5b2b2b;--l2:#5a4a1c;--l3:#24502f;--l4:#2f7a48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:16px 20px 0}
h1{margin:0;font-size:20px;color:var(--pri)}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
nav{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--acc)}
main{padding:16px 20px 40px;max-width:1300px;margin:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:60px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.del{background:none;color:#d64545;border:1px solid var(--bd);padding:4px 9px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi b{display:block;font-size:24px;color:var(--pri)}.kpi span{color:var(--mut);font-size:12px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--mut);background:var(--card);position:sticky;top:0}
td.n,th.n{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
td.n small{display:block;color:var(--mut)}
td select{border:0;width:58px;text-align:center;font-weight:700;border-radius:6px;padding:5px 2px;cursor:pointer}
.l0{background:var(--l0)}.l1{background:var(--l1)}.l2{background:var(--l2)}.l3{background:var(--l3)}.l4{background:var(--l4)}
.gap{font-weight:700}.bad{color:#d64545}.ok{color:#2e9b57}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:10px}
.legend i{font-style:normal;padding:2px 8px;border-radius:6px;color:var(--tx)}
.nine{display:grid;grid-template-columns:28px repeat(3,1fr);gap:6px}
.cellb{min-height:120px;border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--card)}
.cellb h4{margin:0 0 6px;font-size:12px;color:var(--mut)}
.chip{display:block;width:100%;text-align:left;margin-bottom:4px;padding:5px 8px;border-radius:8px;background:var(--l3);border:0;color:var(--tx);font:inherit;font-size:12.5px;cursor:pointer}
.axis{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;color:var(--mut);font-size:12px;align-self:center}
.xl{grid-column:2/5;text-align:center;color:var(--mut);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;background:var(--l0)}
.tag.r0{background:var(--l4)}.tag.r1{background:var(--l2)}.tag.r2{background:var(--l1)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:460px;max-height:90%;overflow:auto}
.modal label{display:block;margin:8px 0 3px;font-size:12px;color:var(--mut)}
.modal input,.modal select{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:20}
@media(max-width:640px){.nine{grid-template-columns:20px repeat(3,1fr);gap:4px}.cellb{padding:5px;min-height:90px}}
</style></head>
<body>
<header><h1>Skill Matrix & Talent Management</h1><div class="sub">Learning & HCM — Tatalogam Group · data terlindungi login</div><div id="who" class="sub" style="margin-top:6px"></div></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal"></div><div id="login"></div>
<script src="/app.js"></script>
</body></html>
